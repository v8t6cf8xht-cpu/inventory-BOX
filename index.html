<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庫存掃描系統</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f5f8;color:#222}
.container{max-width:700px;margin:auto;padding:12px;background:#fff;border-radius:12px;box-shadow:0 2px 12px #0001}
h2{text-align:center;margin:8px 0 15px}h3{margin:20px 0 8px}
.flex-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.flex-left{width:50%}.flex-right{flex:1;min-width:0}
#video{width:100%;aspect-ratio:1/1;object-fit:cover;border:2px solid #ccc;border-radius:10px;background:#111}
label{display:block;font-weight:bold;margin:12px 0 5px;color:#444}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px;min-width:0}
input[type=file]{font-size:14px;padding:9px;background:#fff}
.button-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
button{min-height:44px;padding:10px 8px;border:0;border-radius:7px;font-size:15px;font-weight:bold;cursor:pointer;flex:1}
button:active{transform:scale(.99)}
.optionBtn.selected{outline:3px solid #222;outline-offset:-3px;filter:brightness(.82)}
#locationBtns button{background:#2196F3;color:#fff;min-width:18%}
.red{background:#f44336;color:#fff}.orange{background:#FF9800;color:#fff}.green{background:#4CAF50;color:#fff}.gray{background:#9E9E9E;color:#fff}
#rescanBtn{background:#fff;color:#2196F3;border:2px solid #222}
#stopScanBtn{background:#f44336;color:#fff}
#saveBtn{background:#FFEB3B;color:#000}#exportBtn{background:#FF9800;color:#fff}
#packBtns button{background:#607D8B;color:#fff}
#packBtns button.selected{background:#263238;color:#FFEB3B}
.total-box{margin-top:12px;padding:14px;background:#E8F5E9;border-radius:9px;text-align:center}
.total-number{font-size:30px;font-weight:bold;color:#16833b}
.panel{margin-top:16px;padding:12px;background:#f7f9fc;border:1px solid #e0e5eb;border-radius:10px}
.panel h3{margin-top:0}
.small-note{font-size:13px;color:#666;line-height:1.5;margin:6px 0}
table{width:100%;border-collapse:collapse;margin-top:10px;min-width:650px}
th,td{border:1px solid #ddd;padding:7px;text-align:center;font-size:13px}
th{background:#eaf0f6}.deleteBtn{color:#d00;font-weight:bold;cursor:pointer}
.table-wrap{overflow-x:auto}
.master-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.master-actions button{min-width:110px}
#masterForm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#masterForm button{grid-column:1/-1;background:#1976D2;color:#fff}
#masterCount{font-weight:bold;color:#176b35}
.status{font-size:13px;color:#555;margin-top:6px;min-height:18px}
@media(max-width:420px){button{font-size:14px}.flex-row{gap:7px}#masterForm{grid-template-columns:1fr}#masterForm button{grid-column:auto}#locationBtns button{min-width:28%}}
</style>
</head>
<body>
<div class="container">
<h2>📦 庫存掃描系統</h2>

<div class="flex-row">
  <div class="flex-left"><video id="video" autoplay playsinline muted></video></div>
  <div class="flex-right">
    <label for="item">料號</label>
    <input type="text" id="item" placeholder="掃描或手動輸入">
    <label for="model">型號／品名</label>
    <input type="text" id="model" readonly placeholder="依料件基本資料自動帶出">
  </div>
</div>
<div class="status" id="cameraStatus">相機尚未啟動；如未自動開啟，請按「重新掃描」。</div>
<div class="button-row">
  <button id="rescanBtn">重新掃描</button>
  <button id="stopScanBtn">停止掃描</button>
</div>

<div class="panel">
  <h3>📚 料件基本資料</h3>
  <div class="small-note">程式內已放入 3 筆示範料件。可直接在程式碼的「料件基本資料範例」區新增或刪除；也可在此頁面新增、編輯、刪除，或匯入 Excel（.xlsx／.xls）及 CSV。第一欄放「料號」、第二欄放「品名／型號」。</div>
  <label for="masterFile">匯入料件基本資料</label>
  <input type="file" id="masterFile" accept=".xlsx,.xls,.csv">
  <div class="status" id="masterStatus">目前基本資料：<span id="masterCount">0</span> 筆</div>
  <div id="masterForm">
    <input type="text" id="masterItem" placeholder="新增／修改料號">
    <input type="text" id="masterModel" placeholder="品名／型號">
    <button type="button" id="masterSaveBtn">新增／更新料件</button>
  </div>
  <div class="master-actions">
    <button type="button" id="masterExportBtn" style="background:#607D8B;color:white">匯出基本資料</button>
    <button type="button" id="masterResetBtn" style="background:#1976D2;color:white">重新載入程式碼範例</button>
    <button type="button" id="masterClearBtn" style="background:#eee;color:#333;border:1px solid #bbb">清空基本資料</button>
  </div>
  <div class="table-wrap">
    <table id="masterTable">
      <thead><tr><th>料號</th><th>品名／型號</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<label>儲位</label>
<div class="button-row" id="locationBtns">
  <button class="optionBtn" data-value="C10-1">C10-1</button>
  <button class="optionBtn" data-value="C10-2">C10-2</button>
  <button class="optionBtn" data-value="C10-3">C10-3</button>
  <button class="optionBtn" data-value="C10-4">C10-4</button>
  <button class="optionBtn" data-value="C10-5">C10-5</button>
</div>

<label>每箱入數</label>
<div class="button-row" id="packBtns">
  <button class="optionBtn" data-value="12">12 入</button>
  <button class="optionBtn" data-value="18">18 入</button>
  <button class="optionBtn" data-value="30">30 入</button>
</div>

<label for="boxQty">箱數</label>
<input type="number" id="boxQty" placeholder="請輸入箱數" min="0" step="1">
<label for="looseQty">散裝數量</label>
<input type="number" id="looseQty" placeholder="請輸入散裝數量" min="0" step="1">
<div class="total-box"><div>庫存總數</div><div class="total-number" id="totalQty">0</div><div>個</div></div>

<label>備註</label>
<div class="button-row" id="noteBtns">
  <button class="optionBtn red" data-value="不良">不良</button>
  <button class="optionBtn orange" data-value="待修">待修</button>
  <button class="optionBtn green" data-value="待歸位">待歸位</button>
  <button class="optionBtn gray" data-value="其他">其他</button>
</div>
<input type="text" id="noteInput" placeholder="請輸入其他原因" style="display:none;margin-top:8px">

<div class="button-row" style="margin-top:15px">
  <button id="saveBtn">儲存</button>
  <button id="exportBtn">匯出庫存紀錄</button>
</div>
<h3>📋 庫存紀錄</h3>
<div class="small-note">紀錄會自動保存在目前這台裝置的瀏覽器中；清除瀏覽器資料或更換裝置前，請先匯出備份。</div>
<div class="table-wrap">
<table id="recordTable">
<thead><tr><th>時間</th><th>料號</th><th>型號</th><th>儲位</th><th>每箱入數</th><th>箱數</th><th>散裝</th><th>總數</th><th>備註</th><th>操作</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const MASTER_KEY = "inventoryScan_master_v3";
const RECORD_KEY = "inventoryScan_records_v2";

// ==========================================================
// 料件基本資料範例（可直接在這裡新增或刪除）
// 格式：「料號」:「品名／型號」
// 新增：在下方加一行，例如 "NEW-001": "新產品型號",
// 刪除：將不需要的那一整行刪除（注意逗號）
// ==========================================================
const DEFAULT_ITEM_MODEL_MAP = {
  "ABC-123": "伺服器電源模組 750W",
  "XYZ-888": "工業控制板 V2",
  "A100-01": "馬達驅動器",
  "DEMO-004": "示範料件－感測器模組",
  "DEMO-005": "示範料件－控制器主板"
};

let itemModelMap = {};
let records = [];
let selectedLocation = "";
let selectedPack = 0;
let selectedNote = "";
const video = $("video");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
let stream = null, scanning = false, animationId = null;

function safeLoad(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e) { return fallback; }
}
function saveMaster() { localStorage.setItem(MASTER_KEY, JSON.stringify(itemModelMap)); updateMasterTable(); }
function saveRecords() { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); renderRecords(); }
function updateModel() {
  const code = $("item").value.trim();
  $("model").value = itemModelMap[code] || "";
}
$("item").addEventListener("input", updateModel);

function startCamera() {
  stopCamera();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $("cameraStatus").textContent = "相機無法使用：請透過 HTTPS 網址開啟，並允許相機權限。";
    return;
  }
  $("cameraStatus").textContent = "正在啟動相機…";
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}})
    .then(async s => {
      stream = s; video.srcObject = stream; await video.play();
      scanning = true; $("cameraStatus").textContent = "相機掃描中，請將 QR Code 對準鏡頭。"; scanFrame();
    })
    .catch(err => {
      $("cameraStatus").textContent = "相機無法啟動：" + err.message + "。請檢查 HTTPS 及瀏覽器相機權限。";
    });
}
function stopCamera() {
  scanning = false;
  if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  if ($("cameraStatus")) $("cameraStatus").textContent = "相機已停止。";
}
function scanFrame() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    if (canvas.width && canvas.height) {
      ctx.drawImage(video,0,0);
      const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = window.jsQR ? jsQR(imageData.data,imageData.width,imageData.height) : null;
      if (code && code.data) {
        $("item").value = code.data.trim(); updateModel(); stopCamera();
        $("cameraStatus").textContent = "掃描完成：" + $("item").value;
        return;
      }
    }
  }
  animationId = requestAnimationFrame(scanFrame);
}
$("rescanBtn").addEventListener("click", startCamera);
$("stopScanBtn").addEventListener("click", stopCamera);

function setupButtons(id, callback) {
  document.querySelectorAll("#"+id+" button").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll("#"+id+" button").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected"); callback(btn.dataset.value);
  }));
}
setupButtons("locationBtns", v => selectedLocation = v);
setupButtons("packBtns", v => { selectedPack = Number(v); calculateTotal(); });
setupButtons("noteBtns", v => {
  selectedNote = v;
  $("noteInput").style.display = v === "其他" ? "block" : "none";
  if (v !== "其他") $("noteInput").value = "";
});
function getNumber(id) { const v = $(id).value.trim(); return v === "" ? 0 : Number(v); }
function calculateTotal() {
  const total = getNumber("boxQty") * selectedPack + getNumber("looseQty");
  $("totalQty").textContent = Number.isFinite(total) ? total.toLocaleString() : "0";
  return total;
}
$("boxQty").addEventListener("input",calculateTotal);
$("looseQty").addEventListener("input",calculateTotal);

function addRecord() {
  const item = $("item").value.trim(), model = $("model").value;
  const boxes = $("boxQty").value.trim(), loose = $("looseQty").value.trim();
  const total = calculateTotal();
  const note = selectedNote === "其他" ? $("noteInput").value.trim() : selectedNote;
  if (!item) return alert("請先掃描或輸入料號");
  if (!selectedLocation) return alert("請選擇儲位");
  if (!selectedPack) return alert("請選擇每箱入數");
  if (boxes === "" && loose === "") return alert("請輸入箱數或散裝數量");
  if ((boxes !== "" && (!Number.isInteger(Number(boxes)) || Number(boxes)<0)) ||
      (loose !== "" && (!Number.isInteger(Number(loose)) || Number(loose)<0))) return alert("箱數及散裝數量必須為非負整數");
  if (!Number.isFinite(total) || total <= 0) return alert("總數必須大於 0");
  if (!selectedNote) return alert("請選擇備註；如無備註可選「其他」並輸入「無」");
  if (selectedNote === "其他" && !note) return alert("請輸入其他備註原因");
  records.unshift({
    time:new Date().toLocaleString("zh-TW",{hour12:false}), item, model,
    location:selectedLocation, pack:selectedPack, boxes:boxes||0, loose:loose||0, total, note
  });
  saveRecords(); resetForm(); alert("儲存成功！");
}
$("saveBtn").addEventListener("click",addRecord);
function resetForm() {
  ["item","model","boxQty","looseQty","noteInput"].forEach(id => $(id).value = "");
  $("noteInput").style.display = "none"; $("totalQty").textContent = "0";
  selectedLocation=""; selectedPack=0; selectedNote="";
  document.querySelectorAll(".optionBtn").forEach(b=>b.classList.remove("selected"));
}
function renderRecords() {
  const tbody = $("recordTable").querySelector("tbody"); tbody.innerHTML = "";
  records.forEach((r,index) => {
    const row = tbody.insertRow();
    [r.time,r.item,r.model,r.location,r.pack,r.boxes,r.loose,r.total,r.note].forEach(v => row.insertCell().textContent = v ?? "");
    const cell = row.insertCell(), btn = document.createElement("span");
    btn.textContent="刪除"; btn.className="deleteBtn";
    btn.onclick=()=>{if(confirm("確定刪除此筆紀錄？")){records.splice(index,1);saveRecords();}};
    cell.appendChild(btn);
  });
}
function updateMasterTable() {
  const tbody = $("masterTable").querySelector("tbody"); tbody.innerHTML = "";
  const entries = Object.entries(itemModelMap).sort((a,b)=>a[0].localeCompare(b[0]));
  $("masterCount").textContent = entries.length;
  entries.forEach(([code,name])=>{
    const row=tbody.insertRow(); row.insertCell().textContent=code; row.insertCell().textContent=name;
    const cell=row.insertCell(), edit=document.createElement("button"), del=document.createElement("span");
    edit.textContent="編輯"; edit.style.cssText="background:#e3f2fd;color:#1565c0;min-height:30px;padding:4px 8px";
    edit.onclick=()=>{$("masterItem").value=code;$("masterModel").value=name;window.scrollTo({top:0,behavior:"smooth"});};
    del.textContent="刪除";del.className="deleteBtn";del.style.marginLeft="10px";
    del.onclick=()=>{if(confirm("確定刪除料件 "+code+"？")){delete itemModelMap[code];saveMaster();updateModel();}};
    cell.append(edit,del);
  });
}
$("masterSaveBtn").addEventListener("click",()=>{
  const code=$("masterItem").value.trim(), name=$("masterModel").value.trim();
  if(!code||!name)return alert("請輸入料號及品名／型號");
  itemModelMap[code]=name;saveMaster();$("masterItem").value="";$("masterModel").value="";
  if($("item").value.trim()===code)updateModel();
  alert("料件基本資料已新增／更新");
});
$("masterFile").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;
  if(!window.XLSX){alert("Excel 匯入元件載入失敗，請確認網路後重新整理頁面。");return;}
  try{
    const data=await file.arrayBuffer();
    const workbook=XLSX.read(data,{type:"array"});
    const sheet=workbook.Sheets[workbook.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
    if(!rows.length)throw new Error("檔案沒有資料");
    let start=0,codeCol=0,nameCol=1;
    const headers=rows[0].map(v=>String(v).trim().toLowerCase());
    const c=headers.findIndex(v=>["料號","物料編號","品號","item","item code","料件編號"].includes(v));
    const n=headers.findIndex(v=>["品名","型號","品名／型號","品名/型號","規格","model","description"].includes(v));
    if(c>=0&&n>=0){codeCol=c;nameCol=n;start=1;}
    let count=0;
    for(let i=start;i<rows.length;i++){
      const code=String(rows[i][codeCol]??"").trim(),name=String(rows[i][nameCol]??"").trim();
      if(code&&name){itemModelMap[code]=name;count++;}
    }
    saveMaster();$("masterStatus").textContent="匯入完成："+count+" 筆（重複料號已更新）；目前共 "+Object.keys(itemModelMap).length+" 筆";
    updateModel();alert("料件基本資料匯入完成，共匯入／更新 "+count+" 筆。");
  }catch(err){alert("匯入失敗："+err.message+"。請確認第一欄為料號、第二欄為品名／型號，或使用標題列。");}
  e.target.value="";
});
function downloadCsv(filename,rows){
  const csv="\uFEFF"+rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("masterExportBtn").addEventListener("click",()=>{
  const rows=[["料號","品名／型號"],...Object.entries(itemModelMap)];
  if(rows.length===1)return alert("目前沒有料件基本資料可匯出");
  downloadCsv("料件基本資料_"+localDate()+".csv",rows);
});
$("masterResetBtn").addEventListener("click",()=>{
  if(confirm("確定重新載入程式碼中的範例料件？目前頁面上的料件基本資料會被範例取代。")){
    itemModelMap={...DEFAULT_ITEM_MODEL_MAP};saveMaster();updateModel();
    alert("已重新載入程式碼中的範例料件。");
  }
});
$("masterClearBtn").addEventListener("click",()=>{
  if(confirm("確定清空全部料件基本資料？此操作不會刪除庫存紀錄。")){itemModelMap={};saveMaster();$("model").value="";}
});
function localDate(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
$("exportBtn").addEventListener("click",()=>{
  if(!records.length)return alert("目前沒有資料可以匯出");
  const rows=[["時間","料號","型號／品名","儲位","每箱入數","箱數","散裝","總數","備註"],
    ...records.map(r=>[r.time,r.item,r.model,r.location,r.pack,r.boxes,r.loose,r.total,r.note])];
  downloadCsv("庫存紀錄_"+localDate()+".csv",rows);
});

// 初始化：優先讀取此瀏覽器先前保存的資料；第一次開啟時載入上方程式碼中的範例
itemModelMap=safeLoad(MASTER_KEY,DEFAULT_ITEM_MODEL_MAP);
records=safeLoad(RECORD_KEY,[]);
updateMasterTable();renderRecords();updateModel();
// 初次載入嘗試啟動相機；若瀏覽器阻擋，仍可按「重新掃描」
startCamera();
</script>
</body>
</html>
